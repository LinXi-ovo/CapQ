; CapQ 配置模板
; 用法：复制为 config.ini 再按需修改（config.ini 已被 .gitignore 排除，不会提交）
;
; ── 推荐：密钥放环境变量，不落盘 ──────────────────────
;   myllmurl     = 接口根地址，如 https://api.deepseek.com
;   myllmapi     = 你的 API Key
;   myllmmodelid = 模型名，如 deepseek-chat
; 环境变量优先级高于本文件；设置了就会覆盖下面的同名项。
;
; 首次运行 CapQ.ahk 会自动生成 config.ini。

[api]
; 接口根地址（不带 /chat/completions）
; 被环境变量 myllmurl 覆盖
base=https://api.deepseek.com
; 具体路径
path=/chat/completions
; 模型名
; 被环境变量 myllmmodelid（或 myllmmodel）覆盖
model=deepseek-chat
; 你的 API Key
; 建议留空，改用环境变量 myllmapi，避免明文存盘
key=
; 采样温度 0~2
temperature=0.3
; 单次回答最大 token
maxtok=2048
; 请求超时（秒）
timeout=120

[ui]
; 1=使用系统通知，0=只在托盘/气泡提示
toast=1
; 1=去掉回答里的 Markdown 标记，0=保留原样
trimmarkdown=0
; 历史最多保留条数
historyMax=2000
; 历史最多保留天数
historyDays=90
; 打开链接后是否把浏览器切到前台（1=切到前台，0=留在后台）
urlActivate=1

