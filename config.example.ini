; CapQ 配置模板
; 用法：复制为 config.ini 再填自己的 key（config.ini 已被 .gitignore 排除，不会提交）
;
; 首次运行 CapQ.ahk 会自动生成 config.ini；也可以手动复制本文件改名。

[api]
; 接口根地址（不带 /chat/completions）
base=https://api.deepseek.com
; 具体路径
path=/chat/completions
; 模型名
model=deepseek-chat
; 你的 API Key —— 这行必须是明文，别提交这个文件
key=
; 采样温度 0~2
temperature=0.3
; 单次回答最大 token
maxtok=2048
; 请求超时（秒）
timeout=120

[ui]
; 1=使用系统通知，0=只在托盘/气泡提示
toast=1
; 1=去掉回答里的 Markdown 标记，0=保留原样
trimmarkdown=0
; 历史最多保留条数
historyMax=2000
; 历史最多保留天数
historyDays=90
